matrix:
  url: !secret api_matrix_panel
  method: POST
  content_type: application/json
  payload: >
    {
      "settings": {
        "display": "{{ display }}",
        "brightness": "{{ brightness }}",
        "view": "{{ view }}"
      },
      "data": {
        "temperature": {
          "outside_c": "{{ temperature_outside }}",
          "inside_c": "{{ temperature_inside }}"
        },
        "solar": {
          "power_kw": "{{ inverter_outputpower }}",
          "energy_today_kwh": "{{ inverter_daytotal }}"
        },
        "electricity": {
          "net_energy_today_kwh": "{{ usage_dayenergy }}"
        },
        "utilities": {
          "water_today_litres": "{{ usage_daywater }}",
          "gas_today_m3": "{{ usage_daygas }}"
        },
        "battery": {
          "state_of_charge_percent": "{{ battery_soc }}"
        }
      }
    }
